<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" id="theme-color-meta" content="#ffffff" />
    <title>AdmiQ - Staff dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Runs synchronously before first paint so there's no flash of the
      // wrong theme on load. Mirrors the marketing landing page's own
      // no-flash script (index.html) - including its localStorage key, so
      // a theme choice made on one carries over to the other instead of
      // the two silently disagreeing.
      (function () {
        var saved = localStorage.getItem("admiq-theme");
        var isDark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (isDark) document.documentElement.classList.add("dark");
        var meta = document.getElementById("theme-color-meta");
        if (meta) meta.content = isDark ? "#0a0a0a" : "#ffffff";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
