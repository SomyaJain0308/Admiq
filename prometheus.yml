global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: "admiq"

  alerting:
    alertmanagers:
      - static_configs:
          - targets:
              - alertmanager:9093

  rule_files:
    - "alert.rules.yml"

  scrape_configs:
    - job_name: 'prometheus'
      static_configs:
        - targets: ['localhost:9090']

    - job_name: 'node-exporter'
      static_configs:
        - targets: ['node-exporter:9100']

    - job_name: 'redis-exporter'
      static_configs:
        - targets: ['redis-exporter:9121']

    - job_name: 'sample-app'
      scrape_interval: 10s
      metrics_path: '/metrics'
      static_configs:
        - targets: ['sample-app:8080']