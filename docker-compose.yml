services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: admiq-backend
    volumes:
      - ./backend:/app/backend
      - prometheus_multiproc:/tmp/prometheus_multiproc
    ports:
      - "8000:8000"
    networks:
      - monitoring
    env_file:
      - .env
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    working_dir: /app
    command: fastapi dev backend/app/main.py --host 0.0.0.0 --port 8000 --reload-dir backend/app

  prometheus:
    image: prom/prometheus:v2.37.0
    container_name: admiq-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./secrets:/etc/prometheus/secrets:ro
    ports:
      - "9090:9090"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:9.0.0
    container_name: admiq-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: admiq-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run)($$|/)"
    ports:
      - "9100:9100"
    networks:
      - monitoring

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: admiq-redis-exporter
    env_file:
      - .env
    environment:
      - REDIS_ADDR=${REDIS_URL}
    ports:
      - "9121:9121"
    networks:
      - monitoring

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: admiq-celery
    volumes:
      - ./backend:/app/backend
      - prometheus_multiproc:/tmp/prometheus_multiproc
    networks:
      - monitoring
    env_file:
      - .env
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    working_dir: /app
    command: celery -A backend.app.background_tasks.celery_app worker --loglevel=info --concurrency=1
    depends_on:
      - backend

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: admiq-celery-beat
    volumes:
      - ./backend:/app/backend
      - prometheus_multiproc:/tmp/prometheus_multiproc
    networks:
      - monitoring
    env_file:
      - .env
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    working_dir: /app
    command: celery -A backend.app.background_tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat/celerybeat-schedule
    depends_on:
      - backend

volumes:
  prometheus_multiproc:
  grafana_data:

networks:
  monitoring:
    driver: bridge
