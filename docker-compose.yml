services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: admiq-backend
    volumes:
      - ./backend:/app/backend
      - prometheus_multiproc:/tmp/prometheus_multiproc
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    working_dir: /app
    command: fastapi dev backend/app/main.py --host 0.0.0.0 --port 8000

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: admiq-celery
    volumes:
      - ./backend:/app/backend
      - prometheus_multiproc:/tmp/prometheus_multiproc
    env_file:
      - .env
    environment:
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
    working_dir: /app
    command: celery -A backend.background_tasks.celery_app worker --loglevel=info --concurrency=1
    depends_on:
      - backend

volumes:
  prometheus_multiproc: