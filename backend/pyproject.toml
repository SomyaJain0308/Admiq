[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "SomyaJain0308",email = "SomyaJain0308@gmail.com"}
]
requires-python = "^3.13"
dependencies = [
    "fastapi (>=0.139.0,<0.140.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "pgvector (>=0.4.2,<0.5.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.0.1,<9.0.0)",
    "google-genai (>=2.10.0,<3.0.0)",
    "razorpay (>=2.0.1,<3.0.0)",
    "slowapi (>=0.1.10,<0.2.0)",
    "httpx (>=0.28.1,<0.29.0)"
